import com.github.triplet.gradle.androidpublisher.ReleaseStatus
import com.github.triplet.gradle.androidpublisher.ResolutionStrategy

plugins {
    id 'com.android.application'
    id 'jacoco'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
    id 'com.github.triplet.play'
    id 'com.android.compose.screenshot'
}

def registrySourceFile = layout.projectDirectory.file("src/main/registry/registry.json")
def registrySchemaFile = layout.projectDirectory.file("schemas/com.shapeshed.aerial.data.RegistryDatabase/1.json")
def registryGeneratorScript = layout.projectDirectory.file("../scripts/generate-registry-db.py")
def generatedRegistryAssetsDir = layout.buildDirectory.dir("generated/aerialRegistry/assets")
def generatedRegistryAssetFile = generatedRegistryAssetsDir.map { it.file("registry.db.compressed") }

android {
    experimentalProperties["android.experimental.enableScreenshotTest"] = true
    namespace = 'com.shapeshed.aerial'
    compileSdk 37
    ndkVersion = "28.2.13676358"

    def releaseKeystoreFile = System.getenv("AERIAL_KEYSTORE_FILE")
    def releaseKeystorePassword = System.getenv("AERIAL_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("AERIAL_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("AERIAL_KEY_PASSWORD")
    def hasReleaseSigning = releaseKeystoreFile &&
        releaseKeystorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword

    defaultConfig {
        applicationId "com.shapeshed.aerial"
        minSdk 26
        targetSdk 37
        versionCode 16
        versionName "0.6.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystoreFile)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        deviceTest {
            initWith debug
            applicationIdSuffix ".deviceTest"
            matchingFallbacks = ['debug']
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testBuildType = "deviceTest"

    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    sourceSets {
        main {
            assets.srcDir(generatedRegistryAssetsDir.get().asFile)
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    lint {
        fatal 'UnusedResources'
        // Translation coverage is intentionally incremental; Android falls back to the
        // default locale for strings not yet translated in a locale.
        disable 'MissingTranslation'
    }

    testOptions {
        unitTests {
            // Some framework calls (e.g. Uri.parse, used by media3's MediaItem.Builder) would
            // otherwise throw "not mocked" in plain JUnit tests with no Robolectric.
            returnDefaultValues = true
        }
    }
}

def playServiceAccountJsonFile = System.getenv("AERIAL_PLAY_SERVICE_ACCOUNT_JSON_FILE")

play {
    if (playServiceAccountJsonFile) {
        serviceAccountCredentials.set(file(playServiceAccountJsonFile))
        resolutionStrategy.set(ResolutionStrategy.AUTO)
    }
    defaultToAppBundles.set(true)
    track.set("production")
    releaseStatus.set(ReleaseStatus.COMPLETED)
}

def generateRegistryAsset = tasks.register("generateRegistryAsset", Exec) {
    description = "Generates the compressed offline station registry asset from checked-in JSON."
    group = "build"

    inputs.file(registrySourceFile)
    inputs.file(registrySchemaFile)
    inputs.file(registryGeneratorScript)
    outputs.file(generatedRegistryAssetFile)

    commandLine(
        "python3",
        registryGeneratorScript.asFile.absolutePath,
        "--input", registrySourceFile.asFile.absolutePath,
        "--output", generatedRegistryAssetFile.get().asFile.absolutePath,
        "--schema", registrySchemaFile.asFile.absolutePath,
    )
}

tasks.configureEach {
    if (name ==~ /merge.*Assets/ || name.contains("Lint") || name.contains("lint")) {
        dependsOn(generateRegistryAsset)
    }

    // AGP's device-test lint models include release KSP sources but do not declare the
    // producer dependency. Without this edge the documented combined release gate can
    // race Room/KSP regeneration and fail with a transient FileNotFoundException.
    if (name in ["lintAnalyzeDeviceTestUnitTest", "lintAnalyzeDeviceTestAndroidTest"]) {
        dependsOn("kspReleaseKotlin")
    }
}

tasks.register("jacocoDeviceTestUnitTestReport", JacocoReport) {
    dependsOn("testDeviceTestUnitTest")
    group = "verification"
    description = "Generates JaCoCo coverage for local deviceTest unit tests."

    executionData.from(fileTree(layout.buildDirectory).include(
        "jacoco/testDeviceTestUnitTest.exec",
        "outputs/unit_test_code_coverage/deviceTestUnitTest/testDeviceTestUnitTest.exec",
    ))
    sourceDirectories.from(files("src/main/java", "src/main/kotlin"))
    classDirectories.from(files(
        fileTree(layout.buildDirectory.dir("intermediates/built_in_kotlinc/deviceTest/compileDeviceTestKotlin/classes")) {
            exclude('**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*')
        },
        fileTree(layout.buildDirectory.dir("intermediates/javac/deviceTest/compileDeviceTestJavaWithJavac/classes")) {
            exclude('**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*')
        },
    ))
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.08.00')
    implementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha26'
    implementation 'androidx.compose.material3:material3-adaptive-navigation-suite'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    deviceTestImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'

    def media3Version = '1.11.0'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"

    def roomVersion = '2.8.4'
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    def navigation3Version = '1.1.6'
    implementation "androidx.navigation3:navigation3-runtime:$navigation3Version"
    implementation "androidx.navigation3:navigation3-ui:$navigation3Version"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-navigation3:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-core:1.9.0'
    implementation 'io.coil-kt.coil3:coil-compose:3.5.0'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.5.0'
    implementation 'io.coil-kt.coil3:coil-svg:3.5.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'androidx.concurrent:concurrent-futures-ktx:1.3.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.3.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'

    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test:core-ktx:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    // Compose UI Test still declares Espresso 3.5 transitively. Pin the current stable
    // bridge, which uses Context#getSystemService and supports Android 17 input APIs.
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    screenshotTestImplementation 'com.android.tools.screenshot:screenshot-validation-api:0.0.1-alpha15'
    screenshotTestImplementation 'androidx.compose.ui:ui-tooling'
}
