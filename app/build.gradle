import com.github.triplet.gradle.androidpublisher.ReleaseStatus
import com.github.triplet.gradle.androidpublisher.ResolutionStrategy

plugins {
    alias(libs.plugins.android.application)
    id 'jacoco'
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
    alias(libs.plugins.play.publisher)
    alias(libs.plugins.compose.screenshot)
    alias(libs.plugins.ktlint)
}

ktlint {
    // Pin the ktlint CLI rather than inheriting the plugin's default so upgrades
    // are explicit and Renovate-managed. 1.8.0 parses the Kotlin 2.x sources.
    version = libs.versions.ktlint.get()
    android = true
    // Existing violations are recorded in app/config/ktlint/baseline.xml by
    // `./gradlew :app:ktlintGenerateBaseline`. Only new violations fail the build.
    // Do NOT run a one-shot `ktlintFormat` on the whole project: it does not
    // converge here and leaves more violations than the baseline (see
    // docs/quality-improvement-plan.md §2.3). Reduce the baseline in reviewed
    // batches instead, regenerating it after each step.
}

def registrySourceFile = layout.projectDirectory.file("src/main/registry/registry.json")
def registrySchemaFile = layout.projectDirectory.file("schemas/com.shapeshed.aerial.data.RegistryDatabase/1.json")
def registryGeneratorScript = layout.projectDirectory.file("../scripts/generate-registry-db.py")
def generatedRegistryAssetsDir = layout.buildDirectory.dir("generated/aerialRegistry/assets")
def generatedRegistryAssetFile = generatedRegistryAssetsDir.map { it.file("registry.db.compressed") }

android {
    experimentalProperties["android.experimental.enableScreenshotTest"] = true
    namespace = 'com.shapeshed.aerial'
    compileSdk 37
    ndkVersion = "28.2.13676358"

    def releaseKeystoreFile = System.getenv("AERIAL_KEYSTORE_FILE")
    def releaseKeystorePassword = System.getenv("AERIAL_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("AERIAL_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("AERIAL_KEY_PASSWORD")
    def gitOutput = { List args ->
        providers.exec {
            commandLine "git", *args
        }.standardOutput.asText.get().trim()
    }
    def gitShortSha = gitOutput(["rev-parse", "--short=7", "HEAD"])
    def workingTreeDirty = gitOutput(["status", "--porcelain"])
    def exactTag = gitOutput(["tag", "--points-at", "HEAD"])
    def buildHash = (System.getenv("GITHUB_SHA") ?: gitShortSha).take(7)
    def buildLabel = System.getenv("AERIAL_BUILD_CHANNEL") == "nightly"
        ? "nightly-${buildHash}"
        : (workingTreeDirty && !exactTag ? "dirty-${buildHash}" : "")
    def hasReleaseSigning = releaseKeystoreFile &&
        releaseKeystorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword

    defaultConfig {
        applicationId "com.shapeshed.aerial"
        minSdk 26
        targetSdk 37
        versionCode 19
        versionName "0.7.2"
        buildConfigField "String", "BUILD_LABEL", "\"${buildLabel}\""
        testInstrumentationRunner "com.shapeshed.aerial.testing.AerialTestRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystoreFile)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        deviceTest {
            initWith debug
            applicationIdSuffix ".deviceTest"
            matchingFallbacks = ['debug']
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Release-like, debug-signed variant targeted by the :benchmark module.
        benchmark {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    testBuildType = "deviceTest"

    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    sourceSets {
        main {
            assets.srcDir(generatedRegistryAssetsDir.get().asFile)
        }
        androidTest {
            assets.srcDir(file("$projectDir/schemas"))
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    lint {
        fatal 'UnusedResources'
        // Translation coverage is intentionally incremental; Android falls back to the
        // default locale for strings not yet translated in a locale.
        // AGP 9.3's documented/default Gradle line is 9.5.x. Keep the release-tested wrapper
        // rather than following lint's generic suggestion to use a newer Gradle release.
        disable 'MissingTranslation', 'AndroidGradlePluginVersion'
    }

    testOptions {
        unitTests {
            // Some framework calls (e.g. Uri.parse, used by media3's MediaItem.Builder) would
            // otherwise throw "not mocked" in plain JUnit tests with no Robolectric.
            returnDefaultValues = true
        }
    }
}

def playServiceAccountJsonFile = System.getenv("AERIAL_PLAY_SERVICE_ACCOUNT_JSON_FILE")

play {
    if (playServiceAccountJsonFile) {
        serviceAccountCredentials.set(file(playServiceAccountJsonFile))
        resolutionStrategy.set(ResolutionStrategy.AUTO)
    }
    defaultToAppBundles.set(true)
    track.set("production")
    releaseStatus.set(ReleaseStatus.COMPLETED)
}

def generateRegistryAsset = tasks.register("generateRegistryAsset", Exec) {
    description = "Generates the compressed offline station registry asset from checked-in JSON."
    group = "build"

    inputs.file(registrySourceFile)
    inputs.file(registrySchemaFile)
    inputs.file(registryGeneratorScript)
    outputs.file(generatedRegistryAssetFile)

    commandLine(
        "python3",
        registryGeneratorScript.asFile.absolutePath,
        "--input", registrySourceFile.asFile.absolutePath,
        "--output", generatedRegistryAssetFile.get().asFile.absolutePath,
        "--schema", registrySchemaFile.asFile.absolutePath,
    )
}

tasks.configureEach {
    if (name ==~ /merge.*Assets/ || name.contains("Lint") || name.contains("lint")) {
        dependsOn(generateRegistryAsset)
    }

    // AGP's device-test lint models include release KSP sources but do not declare the
    // producer dependency. Without this edge the documented combined release gate can
    // race Room/KSP regeneration and fail with a transient FileNotFoundException.
    if (name in ["lintAnalyzeDeviceTestUnitTest", "lintAnalyzeDeviceTestAndroidTest"]) {
        dependsOn("kspReleaseKotlin")
    }
}

// Shared inputs for the coverage report and its verification rule so the two can
// never drift apart. Only owner-written classes are measured: generated Room
// implementations, Hilt/Dagger output, R/BuildConfig and compiler synthetics are
// excluded, otherwise the denominator is polluted and the ratio is meaningless.
def deviceTestUnitTestExecutionData = fileTree(layout.buildDirectory).include(
    "jacoco/testDeviceTestUnitTest.exec",
    "outputs/unit_test_code_coverage/deviceTestUnitTest/testDeviceTestUnitTest.exec",
)
// The post-ASM classes are the exact bytecode the unit-test task executes, so the
// execution data and the class files share JaCoCo's class id and the report is
// free of "Classes in bundle ... do not match with execution data" mismatches.
def deviceTestUnitTestClassDirectories = fileTree(
    layout.buildDirectory.dir("intermediates/classes/deviceTest/transformDeviceTestClassesWithAsm/dirs"),
) {
    include('com/shapeshed/aerial/**')
    exclude(
        // Android toolchain generated.
        '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
        // Hilt / Dagger generated.
        '**/*Hilt*', '**/Dagger*', '**/*_Factory*', '**/*_MembersInjector*',
        // Room generated database and DAO implementations.
        '**/*_Impl.class', '**/*_Impl$*.class',
        // Kotlin compiler `when`/sealed mappings, which contain no source lines.
        '**/*$WhenMappings.class',
    )
}

tasks.register("jacocoDeviceTestUnitTestReport", JacocoReport) {
    dependsOn("testDeviceTestUnitTest")
    group = "verification"
    description = "Generates JaCoCo coverage for local deviceTest unit tests."

    executionData.from(deviceTestUnitTestExecutionData)
    sourceDirectories.from(files("src/main/java", "src/main/kotlin"))
    classDirectories.from(deviceTestUnitTestClassDirectories)
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

tasks.register("jacocoDeviceTestUnitTestCoverageVerification", JacocoCoverageVerification) {
    dependsOn("testDeviceTestUnitTest")
    group = "verification"
    description = "Verifies the measured line coverage for local deviceTest unit tests."

    executionData.from(deviceTestUnitTestExecutionData)
    classDirectories.from(deviceTestUnitTestClassDirectories)
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                // Baseline recorded after excluding generated classes (measured
                // 0.237 on 2026-09-21); raise as new behavior tests land rather
                // than lowering to fit the current suite.
                minimum = 0.23
            }
        }
    }
}

