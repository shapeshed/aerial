name: Nightly Build

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  nightly:
    name: Build and publish nightly APK
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    if: github.repository_owner == 'shapeshed'
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for commits in the last 24 hours
        id: check
        run: |
          if [ -z "$(git log --since='24 hours ago' -1)" ]; then
            echo "No commits in the last 24 hours; skipping nightly build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - name: Set up Gradle
        if: steps.check.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Make Gradle wrapper executable
        if: steps.check.outputs.skip != 'true'
        run: chmod +x ./gradlew

      - name: Decode release keystore
        if: steps.check.outputs.skip != 'true'
        env:
          AERIAL_KEYSTORE_BASE64: ${{ secrets.AERIAL_KEYSTORE_BASE64 }}
          AERIAL_KEYSTORE_PASSWORD: ${{ secrets.AERIAL_KEYSTORE_PASSWORD }}
          AERIAL_KEY_ALIAS: ${{ secrets.AERIAL_KEY_ALIAS }}
          AERIAL_KEY_PASSWORD: ${{ secrets.AERIAL_KEY_PASSWORD }}
        run: |
          if [ -z "$AERIAL_KEYSTORE_BASE64" ] ||
             [ -z "$AERIAL_KEYSTORE_PASSWORD" ] ||
             [ -z "$AERIAL_KEY_ALIAS" ] ||
             [ -z "$AERIAL_KEY_PASSWORD" ]; then
            echo "All Aerial signing secrets are required for nightly builds — an unsigned APK cannot be installed." >&2
            exit 1
          fi
          printf '%s' "$AERIAL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aerial-release.jks"

      - name: Build signed release APK
        if: steps.check.outputs.skip != 'true'
        env:
          AERIAL_KEYSTORE_FILE: ${{ runner.temp }}/aerial-release.jks
          AERIAL_KEYSTORE_PASSWORD: ${{ secrets.AERIAL_KEYSTORE_PASSWORD }}
          AERIAL_KEY_ALIAS: ${{ secrets.AERIAL_KEY_ALIAS }}
          AERIAL_KEY_PASSWORD: ${{ secrets.AERIAL_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        id: rename
        if: steps.check.outputs.skip != 'true'
        run: |
          set -eu
          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "Expected signed APK at $apk" >&2
            exit 1
          fi
          short_sha=$(echo "${{ github.sha }}" | cut -c1-7)
          name="aerial-nightly-${short_sha}.apk"
          mv "$apk" "./$name"
          sha256sum "./$name" > "./$name.sha256"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"
          echo "SBOM_NAME=${name%.apk}.cdx.json" >> "$GITHUB_ENV"
          echo "apk_name=$name" >> "$GITHUB_OUTPUT"
          echo "sbom_name=${name%.apk}.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Generate build provenance
        if: steps.check.outputs.skip != 'true'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ env.APK_NAME }}

      - name: Prepare provenance asset
        if: steps.check.outputs.skip != 'true'
        run: |
          set -eu
          provenance="${APK_NAME%.apk}.intoto.jsonl"
          install -m 0644 "${{ steps.attest.outputs.bundle-path }}" "./$provenance"
          echo "PROVENANCE_NAME=$provenance" >> "$GITHUB_ENV"

      - name: Generate SBOM
        if: steps.check.outputs.skip != 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: ${{ steps.rename.outputs.apk_name }}
          format: cyclonedx-json
          output-file: ./${{ steps.rename.outputs.sbom_name }}
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Replace nightly release
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete nightly --repo "$GITHUB_REPOSITORY" -y --cleanup-tag
          fi
          gh release create nightly "./$APK_NAME" "./$APK_NAME.sha256" "./$PROVENANCE_NAME" "./$SBOM_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Aerial Nightly" \
            --notes "Automated build from \`main\` @ ${{ github.sha }}. Signed with the same key as tagged releases, so it installs cleanly as an update over a previous nightly (but not over a Play Store install, which uses Play App Signing). For testing only — this tag is force-updated on every nightly build."
