name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run quality gate
        run: ./gradlew quality

      - name: Validate Compose screenshots
        run: ./gradlew validateDebugScreenshotTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify minified release and R8 configuration
        run: ./gradlew assembleRelease analyzeReleaseR8Config

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: aerial-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator:
    name: Instrumented tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run local unit tests with coverage
        run: ./gradlew jacocoDeviceTestUnitTestReport jacocoDeviceTestUnitTestCoverageVerification

      - name: Upload JaCoCo coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: ./app/build/reports/jacoco/jacocoDeviceTestUnitTestReport/jacocoDeviceTestUnitTestReport.xml
          flags: device-test-unit
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}

      # The emulator action installs the SDK packages itself, but a transient
      # "Premature EOF" from the SDK download can fail the whole job before any
      # test runs. Pre-install the same packages with retries so the action's
      # install step is satisfied from the local SDK cache.
      - name: Pre-install emulator and system image (retry on transient failures)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          for attempt in 1 2 3 4 5; do
            if sdkmanager --install emulator "system-images;android-34;default;x86_64"; then
              exit 0
            fi
            echo "sdkmanager attempt ${attempt} failed; retrying in 20s"
            sleep 20
          done
          echo "sdkmanager failed after retries" >&2
          exit 1

      - name: Start Android emulator and run isolated device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          target: default
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: ./scripts/check-device-ready.sh && ./gradlew connectedDeviceTestAndroidTest

      - name: Upload unit coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aerial-unit-coverage
          path: app/build/reports/jacoco/jacocoDeviceTestUnitTestReport
          if-no-files-found: warn

      - name: Upload local test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aerial-local-test-reports
          path: app/build/test-results/test*UnitTest
          if-no-files-found: warn

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aerial-device-test-reports
          path: app/build/reports/androidTests/connected
          if-no-files-found: warn
