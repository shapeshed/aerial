org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.experimental.enableScreenshotTest=true
# AGP 9.5's Compose Preview task, which lint depends on when screenshot tests are enabled,
# needs a unit test variant for every build type, but testBuildType is deviceTest.
android.onlyEnableUnitTestForTheTestedBuildType=false
